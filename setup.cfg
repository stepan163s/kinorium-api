[metadata]
name = kinorium
version = 0.1.1
description = A Python wrapper for the Kinorium API
long_description = file: README.md
long_description_content_type = text/markdown
author = Orivo Contributors
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.7
install_requires =
    requests>=2.25.0
    aiohttp>=3.8.0

[options.packages.find]
include =
    kinorium
    kinorium.*

[options.entry_points]
console_scripts =
    kinorium-auth = kinorium.cli:main
